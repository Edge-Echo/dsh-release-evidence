# The release gate a plugin author drops into a workflow.
#
# It runs the evidence-producing tools that are installed, packs whatever reports they
# wrote into one signed artifact, and fails the job when required evidence is missing.
# The pack is uploaded so a reviewer — or a marketplace — can verify it later without
# trusting this workflow or the machine it ran on.
#
# Note for anyone editing this file: YAML comments start with `#`, not `//`. A `//`
# header makes the whole manifest unparseable, and GitHub reports it as
# "Mapping values are not allowed in this context" at the first real key — which is
# how this file failed its first real run.
name: DSH release evidence
description: Pack a DSH plugin's release evidence into one signed, verifiable artifact
author: Edge-Echo
branding:
  icon: shield
  color: green

inputs:
  dsh-version:
    description: Exact DSH version to test against
    required: false
  suite:
    description: dsh-testkit suite to run (quick or full)
    required: false
    default: quick
  plugin-source:
    description: What dsh-test should install and exercise (a tarball, a package spec, or a directory)
    required: false
    default: '.'
  run-testkit:
    description: Run the dsh-testkit lifecycle gate before packing
    required: false
    default: 'true'
  signing-key:
    description: Ed25519 private key (PEM) used to sign the pack; unsigned when omitted
    required: false
  expires-days:
    description: Days after which the pack should be treated as stale
    required: false
    default: '30'
  require-complete:
    description: Fail when required evidence (lifecycle test, packed artifact) is absent
    required: false
    default: 'true'

outputs:
  pack-path:
    description: Directory holding evidence.json and EVIDENCE.md
    value: ${{ steps.pack.outputs.pack-path }}
  evidence-root:
    description: Merkle root over the evidence digests
    value: ${{ steps.pack.outputs.evidence-root }}
  verified:
    description: Whether the pack verified immediately after being built
    value: ${{ steps.pack.outputs.verified }}

runs:
  using: composite
  steps:
    - name: Install the evidence toolchain
      shell: bash
      run: |
        # Installed rather than fetched per step so npx resolves the same binary every time.
        npm install --no-save dsh-release-evidence@^0.1.0
        if [ "${{ inputs.run-testkit }}" = "true" ]; then
          npm install --no-save dsh-testkit@^0.4.4
        fi

    - name: Run the lifecycle gate
      if: inputs.run-testkit == 'true'
      shell: bash
      run: |
        # dsh-test takes the plugin source positionally: `dsh-test [plugin-source] [directory]`.
        # Omitting it exits 2 with "plugin source is required", which is invalid input, not a
        # lifecycle failure — so the run continues but the pack ends up incomplete.
        #
        # Exit codes are meaningful: 0 passed, 1 lifecycle failure, 3 infrastructure.
        # A lifecycle failure must fail the job; infrastructure trouble does not masquerade
        # as a passing gate, because the pack will then report missing lifecycle evidence.
        set +e
        npx --yes dsh-test@^0.4.4 --suite "${{ inputs.suite }}" \
          ${{ inputs.dsh-version && format('--dsh {0}', inputs.dsh-version) || '' }} \
          "${{ inputs.plugin-source }}"
        code=$?
        set -e
        echo "dsh-test exited $code"
        if [ "$code" = "1" ]; then exit 1; fi
        if [ "$code" = "2" ]; then
          echo "::error::dsh-test rejected its input (exit 2). Check plugin-source and dsh-version."
          exit 1
        fi

    - name: Write the signing key
      if: inputs.signing-key != ''
      shell: bash
      run: |
        KEY_FILE="$RUNNER_TEMP/evidence-key.pem"
        printf '%s' "${{ inputs.signing-key }}" > "$KEY_FILE"
        echo "EVIDENCE_KEY=$KEY_FILE" >> "$GITHUB_ENV"

    - name: Pack the evidence
      id: pack
      shell: bash
      run: |
        npx --yes dsh-release-evidence@^0.1.0 pack \
          --out .dsh-evidence \
          --expires-days "${{ inputs.expires-days }}" \
          --pack-tarball \
          ${{ env.EVIDENCE_KEY && format('--key {0}', env.EVIDENCE_KEY) || '' }}
        echo "pack-path=.dsh-evidence" >> "$GITHUB_OUTPUT"
        root=$(node -e "console.log(require('./.dsh-evidence/evidence.json').evidenceRoot)")
        echo "evidence-root=$root" >> "$GITHUB_OUTPUT"
        verified=$(node -e "const p=require('./.dsh-evidence/evidence.json');console.log(Boolean(p.signature))")
        echo "verified=$verified" >> "$GITHUB_OUTPUT"

    - name: Verify the pack as a third party would
      shell: bash
      run: |
        npx --yes dsh-release-evidence@^0.1.0 verify .dsh-evidence \
          ${{ inputs.require-complete == 'true' && '--require-complete' || '' }}

    - name: Upload the pack
      uses: actions/upload-artifact@v4
      with:
        name: dsh-release-evidence
        path: .dsh-evidence/
        if-no-files-found: error
        # The default output directory is dot-prefixed, and upload-artifact v4 skips
        # hidden files unless this is set. Without it the pack is built, verified, and
        # then silently not uploaded - which is how the first green-looking run failed.
        include-hidden-files: true
